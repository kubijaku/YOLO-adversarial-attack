[project]
name = "yolo-adversarial-attack"
version = "0.1.0"
description = "Project presents adversarial attack using fast gradient signed method (FGSM) against one of the best object recognition model - YOLO version 8"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib~=3.10.7",
    "mypy>=1.19.0",
    "nltk>=3.9.2",
    "numpy>=2.2.6",
    "opencv-python~=4.12.0.88",
    "pandas~=2.3.3",
    "pillow~=12.0.0",
    "scikit-learn>=1.7.2",
    "seaborn~=0.13.2",
    "torch>=2.9.1",
    "ultralytics~=8.3.228",
]

[tool.setuptools.packag]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]